name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned on purpose: formatting rules change between clang-format majors,
      # and an unpinned bump would reformat unrelated lines. Local development
      # uses the same major (18).
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      # Only the lines this change touches are checked. The fork keeps upstream
      # KDE formatting, which is not clang-format clean as a whole; a
      # whole-file check would reformat upstream code and make manual pulls of
      # upstream security fixes painful.
      - name: Check formatting (changed lines)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            # A branch created by this push reports an all-zero "before".
            case "$base" in
              0000000000000000000000000000000000000000) base="HEAD~1" ;;
            esac
          fi
          git-clang-format-18 --binary clang-format-18 --diff "$base" HEAD -- \
            '*.cpp' '*.cc' '*.h' '*.hpp'

  # NOTE(bootstrap): the Qt6 + KF6 build is being brought off Craft on Windows
  # (risk R-1). Until the toolchain recipe is proven, this job is a best-effort
  # build on Linux to catch code regressions early. Refined in M1.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
      - name: Install KDE Frameworks
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules \
            libkf6coreaddons-dev libkf6config-dev libkf6dbusaddons-dev \
            libkf6crash-dev libkf6i18n-dev libkf6notifications-dev \
            libkf6iconthemes-dev libkf6kio-dev libkf6windowsystem-dev
        continue-on-error: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
        continue-on-error: true
      - name: Build
        run: cmake --build build --parallel
        continue-on-error: true
